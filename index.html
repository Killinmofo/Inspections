<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Inspections | Administrative demo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#202934;font:15px system-ui,sans-serif}header{background:#253343;color:white;padding:22px 5%}header h1{margin:0;font-size:24px}header p{margin:6px 0;color:#d4dce6}main{max-width:1100px;margin:auto;padding:24px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}button,input,select{font:inherit;padding:9px 12px;border:1px solid #b9c2cc;border-radius:5px;background:white;color:inherit}button{cursor:pointer}button.primary,button.active{background:#253343;color:white}section{background:white;border:1px solid #dce1e6;border-radius:8px;padding:20px;margin-bottom:16px}h2{margin:0 0 16px;font-size:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.metric{background:#f4f5f7;padding:16px;border-radius:5px}.metric strong{display:block;font-size:28px}label{display:grid;gap:5px;margin-bottom:10px}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left}td,th{padding:10px;border-bottom:1px solid #e3e7eb;white-space:nowrap}th{background:#f4f5f7}.bad{color:#a32727}.good{color:#176746}.muted{color:#65717e}.warn{color:#875b00}footer{font-size:13px;color:#65717e}dialog{border:1px solid #ccd2d9;border-radius:8px;max-width:500px;width:90%}dialog::backdrop{background:#0005}
</style><header><h1>Inspections</h1><p>Administrative personnel and training records · Fictional demonstration</p></header><main><nav id="nav"></nav><div id="view"></div><footer>Demo only. Browser storage is not an approved records system. Do not enter actual DoD IDs, sensitive records, or operational inventory. No issuance or authorization functionality.</footer></main><dialog id="editor"><form id="editForm"><h2 id="editTitle"></h2><div id="fields"></div><button class="primary" type="submit">Save</button> <button type="button" id="cancel">Cancel</button></form></dialog>
<script>
"use strict";
const key="inspections-admin-demo-v1", topics=["M18","M4A1","M4","M110A1","Baton","Radio","O.C. Spray","Taser"];
const seed=()=>({people:[{id:"DEMO-001",last:"Demo",first:"Alex",grade:"SSgt",unit:"Example Unit",dates:{"M18":"2027-12-31","M4A1":"2025-10-31","Baton":"2027-06-30"}},{id:"DEMO-002",last:"Sample",first:"Jordan",grade:"SrA",unit:"Example Unit",dates:{"M4":"2027-12-31","Taser":"2027-08-31"}}],na:["Radio"],warning:30});
let state;try{state=JSON.parse(localStorage.getItem(key))||seed()}catch{state=seed()}let page="Dashboard",selected=state.people[0]?.id||"",editing=null; state.grades??=["AB","Amn","A1C","SrA","SSgt","TSgt","MSgt","SMSgt","CMSgt","Civilian"];state.units??=["Example Unit"];let query="",showArchived=false,reportStatus="All",reportTopic="All";const active=()=>state.people.filter(p=>!p.archived);
const $=id=>document.getElementById(id), el=(tag,txt,cls)=>{const n=document.createElement(tag);if(txt!==undefined)n.textContent=txt;if(cls)n.className=cls;return n},save=()=>localStorage.setItem(key,JSON.stringify(state)),name=p=>p.last+", "+p.first, today=()=>new Date().toLocaleDateString("en-CA"),status=(p,t)=>{if(state.na.includes(t))return "N/A";const d=p.dates[t];if(!d)return "Unqualified";const now=new Date();now.setHours(0,0,0,0);const end=new Date(d+"T00:00:00");const days=Math.round((end-now)/86400000);return days<0?"Unqualified":days<=state.warning?"Expiring":"Current"};
function btn(label,fn,cls){const b=el("button",label,cls);b.type="button";b.onclick=fn;return b}
function section(title){const s=el("section");s.append(el("h2",title));$("view").append(s);return s}
function table(s,headers,rows){const wrap=el("div",undefined,"scroll"),t=el("table"),head=el("tr");headers.forEach(h=>head.append(el("th",h)));t.append(head);rows.forEach(row=>{const tr=el("tr");row.forEach(v=>{const td=el("td");if(v instanceof Node)td.append(v);else td.textContent=v;tr.append(td)});t.append(tr)});wrap.append(t);s.append(wrap)}
function choose(s){const label=el("label","Select individual"),sel=el("select");active().forEach(p=>{const o=el("option",name(p)+" ("+p.id+")");o.value=p.id;sel.append(o)});if(!active().some(p=>p.id===selected))selected=active()[0]?.id||"";sel.value=selected;sel.onchange=()=>{selected=sel.value;render()};label.append(sel);s.append(label);return active().find(p=>p.id===selected)}
function mark(v){return el("span",v,v==="Unqualified"?"bad":v==="Current"?"good":v==="Expiring"?"warn":"muted")}
function field(parent,label,value,type="text"){const l=el("label",label),i=el("input");i.type=type;i.value=value??"";l.append(i);parent.append(l);return i}
function pick(parent,label,values,value){const l=el("label",label),s=el("select");[...new Set(["",...values,...(value?[value]:[])])].forEach(v=>{const o=el("option",v||"Select…");o.value=v;s.append(o)});s.value=value||"";l.append(s);parent.append(l);return s} function edit(p){editing=p;$("editTitle").textContent=p?"Edit fictional record":"Add fictional record";const f=$("fields");f.replaceChildren();const a=["id","last","first","grade","unit"].map(k=>k==="grade"?pick(f,"Grade",state.grades,p?.grade):k==="unit"?pick(f,"Organization",state.units,p?.unit):field(f,({id:"Demo ID",last:"Last name",first:"First name"})[k],p?.[k]));a.slice(0,3).forEach(i=>i.required=true);if(p)a[0].readOnly=true;$("editForm").onsubmit=e=>{e.preventDefault();const values=a.map(i=>i.value.trim());if(!/^DEMO-[0-9]+$/.test(values[0]))return alert("Use a fictional ID such as DEMO-003.");if(!p&&state.people.some(x=>x.id===values[0]))return alert("Duplicate ID.");const record=Object.fromEntries(["id","last","first","grade","unit"].map((k,i)=>[k,values[i]]));record.dates=p?.dates||{};record.archived=p?.archived||false;if(p)state.people[state.people.indexOf(p)]=record;else state.people.push(record);save();$("editor").close();render()};$("editor").showModal()}

// Administrative asset accountability; no access or issuance decisions.
const demoAssets=()=>[
{id:"ASSET-001",category:"Radio",tag:"R01",serial:"DEMO-R001",description:"Training radio",model:"Demo R",manufacturer:"Example",custodian:"DEMO-001",mode:"Individual",notes:""},
{id:"ASSET-002",category:"Laptop",tag:"L01",serial:"DEMO-L001",description:"Office laptop",model:"Demo L",manufacturer:"Example",custodian:"",mode:"Individual",notes:""},
{id:"ASSET-003",category:"Radio",tag:"R02",serial:"DEMO-R002",description:"Shared radio",model:"Demo R",manufacturer:"Example",custodian:"",mode:"Shared",notes:""}];
state.assets??=demoAssets();
let assetQuery="",assetMode="All";
const custody=a=>a.mode==="Shared"?"Shared use":a.custodian?(state.people.find(p=>p.id===a.custodian)?name(state.people.find(p=>p.id===a.custodian)):"Record missing"):"Unassigned";
function editAsset(a){
 const f=$("fields");f.replaceChildren();$("editTitle").textContent=a?"Edit asset record":"Add fictional asset";
 const keys=["id","category","tag","serial","description","model","manufacturer","notes"];
 const labels=["Asset ID","Category","Local tag","Serial number","Description","Model","Manufacturer","Notes"];
 const fields=keys.map((k,i)=>field(f,labels[i],a?.[k]));
 fields[0].required=true;fields[1].required=true;fields[2].required=true;if(a)fields[0].readOnly=true;
 const mode=pick(f,"Record type",["Individual","Shared"],a?.mode||"Individual");
 const l=el("label","Recorded custodian"),sel=el("select");const blank=el("option","Unassigned");blank.value="";sel.append(blank);
 active().forEach(p=>{const o=el("option",name(p)+" ("+p.id+")");o.value=p.id;sel.append(o)});
 if(a?.custodian&&!active().some(p=>p.id===a.custodian)){const o=el("option","Archived or missing record ("+a.custodian+")");o.value=a.custodian;sel.append(o)}
 sel.value=a?.custodian||"";l.append(sel);f.append(l);const sync=()=>{sel.disabled=mode.value==="Shared"};mode.onchange=sync;sync();
 $("editForm").onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(keys.map((k,i)=>[k,fields[i].value.trim()]));if(!/^ASSET-[0-9]+$/.test(v.id))return alert("Use a fictional ID such as ASSET-004.");
 if(state.assets.some(x=>x!==a&&(x.id===v.id||(x.category.toLowerCase()===v.category.toLowerCase()&&x.tag.toLowerCase()===v.tag.toLowerCase()))))return alert("Duplicate asset ID or category and tag.");
 if(!mode.value)return alert("Select a record type.");v.mode=mode.value;v.custodian=mode.value==="Shared"?"":sel.value;
 if(a)state.assets[state.assets.indexOf(a)]=v;else state.assets.push(v);save();$("editor").close();render()};
 $("editor").showModal()
}
function renderAssets(){const s=section("Administrative asset register");s.append(el("p","Fictional non-weapon office and communications assets for accountability review."));s.append(btn("Add asset",()=>editAsset(null),"primary"));const q=field(s,"Search assets",assetQuery),m=pick(s,"Record type",["All","Individual","Shared"],assetMode),out=el("div");s.append(out);
 function draw(){out.replaceChildren();const rows=state.assets.filter(a=>(assetMode==="All"||a.mode===assetMode)&&[a.id,a.category,a.tag,a.serial,a.description,a.model,custody(a)].join(" ").toLowerCase().includes(assetQuery.toLowerCase()));table(out,["Asset ID","Category","Tag","Serial","Description","Type","Recorded custodian","Actions"],rows.map(a=>[a.id,a.category,a.tag,a.serial,a.description,a.mode,custody(a),btn("Edit",()=>editAsset(a))]));if(!rows.length)out.append(el("p","No matching assets."))}
 q.oninput=()=>{assetQuery=q.value;draw()};m.onchange=()=>{assetMode=m.value||"All";draw()};draw()
}

function render(){const n=$("nav");n.replaceChildren();["Dashboard","Personnel","Qualifications","Assets","Review","Reports","Settings"].forEach(p=>n.append(btn(p,()=>{page=p;render()},p===page?"active":"")));$("view").replaceChildren();
if(page==="Dashboard"){const s=section("Overview"),g=el("div",undefined,"grid");const counts=active().flatMap(p=>topics.map(t=>status(p,t)));[["Active personnel",active().length],["Current",counts.filter(x=>x==="Current").length],["Expiring",counts.filter(x=>x==="Expiring").length],["Unqualified",counts.filter(x=>x==="Unqualified").length]].forEach(([label,v])=>{const m=el("div",label,"metric");m.append(el("strong",v));g.append(m)});s.append(g);section("About this demo").append(el("p","Track fictional personnel and training expiration dates independently. Review missing and expired dates without altering the original records."))}
if(page==="Personnel"){const s=section("Personnel database");s.append(btn("Add person",()=>edit(null),"primary"));const q=field(s,"Search name, ID, grade or organization",query);q.oninput=()=>{query=q.value;draw()};const toggle=btn(showArchived?"Hide archived":"Show archived",()=>{showArchived=!showArchived;render()});s.append(toggle);const results=el("div");s.append(results);function draw(){results.replaceChildren();const rows=state.people.filter(p=>(showArchived||!p.archived)&&[name(p),p.id,p.grade,p.unit].join(" ").toLowerCase().includes(query.toLowerCase()));table(results,["Name","Demo ID","Grade","Organization","Status","Actions"],rows.map(p=>{const a=el("div");a.append(btn("Edit",()=>edit(p)),btn(p.archived?"Restore":"Archive",()=>{if(confirm((p.archived?"Restore ":"Archive ")+name(p)+"?")){p.archived=!p.archived;save();render()}}));return[name(p),p.id,p.grade,p.unit,p.archived?"Archived":"Active",a]}));if(!rows.length)results.append(el("p","No matching records."))}draw()}
if(page==="Assets"){renderAssets()}
if(page==="Qualifications"){const s=section("Qualification records"),p=choose(s);if(!p){s.append(el("p","No active personnel. Add or restore a fictional record first."));return;}const form=el("form"),inputs={};topics.forEach(t=>inputs[t]=field(form,t,p.dates[t],"date"));const b=el("button","Save dates","primary");b.type="submit";form.append(b);form.onsubmit=e=>{e.preventDefault();topics.forEach(t=>p.dates[t]=inputs[t].value);save();render()};s.append(form)}
if(page==="Review"){const s=section("Individual review"),p=choose(s);if(!p){s.append(el("p","No active personnel. Add or restore a fictional record first."));return;}s.append(el("p",name(p)+" · "+p.grade+" · "+p.unit));table(s,["Training category","Recorded expiration","Status"],topics.map(t=>[t,p.dates[t]||"Not entered",mark(status(p,t))]));const a=section("Recorded administrative assets");const rows=state.assets.filter(x=>x.custodian===p.id&&x.mode==="Individual");table(a,["Asset","Category","Tag","Description"],rows.map(x=>[x.id,x.category,x.tag,x.description]));if(!rows.length)a.append(el("p","No recorded administrative assets."))}
if(page==="Reports"){const s=section("Qualification records report");const a=pick(s,"Status",["All","Current","Expiring","Unqualified","N/A"],reportStatus),b=pick(s,"Training category",["All",...topics],reportTopic);a.onchange=()=>{reportStatus=a.value||"All";render()};b.onchange=()=>{reportTopic=b.value||"All";render()};const rows=active().flatMap(p=>topics.map(t=>({p,t,v:status(p,t)}))).filter(x=>(reportStatus==="All"||x.v===reportStatus)&&(reportTopic==="All"||x.t===reportTopic));s.append(el("p",rows.length+" matching training records"));table(s,["Name","Category","Recorded expiration","Status"],rows.map(({p,t,v})=>[name(p),t,p.dates[t]||"Not entered",mark(v)]));} if(page==="Settings"){const s=section("Administrative preferences"),w=field(s,"Expiration warning days",String(state.warning),"number");w.min=0;w.max=365;w.onchange=()=>{state.warning=Math.max(0,Math.min(365,Number(w.value)||0));save();render()};for(const [k,label] of [["grades","Grades"],["units","Organizations"]]){s.append(el("h3",label));const i=field(s,"Options (comma separated)",state[k].join(", "));s.append(btn("Save "+label.toLowerCase(),()=>{state[k]=[...new Set(i.value.split(",").map(v=>v.trim()).filter(Boolean))];save();render()}))}s.append(el("h3","Not applicable training categories"));topics.forEach(t=>{const l=el("label"),c=el("input");c.type="checkbox";c.checked=state.na.includes(t);c.onchange=()=>{state.na=c.checked?[...new Set([...state.na,t])]:state.na.filter(x=>x!==t);save();render()};l.style.display="flex";l.append(c,document.createTextNode(t));s.append(l)});s.append(btn("Reset fictional demo",()=>{if(confirm("Replace all local demo changes?")){state=seed();state.assets=demoAssets();state.grades=["AB","Amn","A1C","SrA","SSgt","TSgt","MSgt","SMSgt","CMSgt","Civilian"];state.units=["Example Unit"];save();render()}}))}
}
$("cancel").onclick=()=>$("editor").close();render();
</script></html>
