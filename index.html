<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Inspections | Administrative demo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#202934;font:15px system-ui,sans-serif}header{background:#253343;color:white;padding:22px 5%}header h1{margin:0;font-size:24px}header p{margin:6px 0;color:#d4dce6}main{max-width:1100px;margin:auto;padding:24px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}button,input,select{font:inherit;padding:9px 12px;border:1px solid #b9c2cc;border-radius:5px;background:white;color:inherit}button{cursor:pointer}button.primary,button.active{background:#253343;color:white}section{background:white;border:1px solid #dce1e6;border-radius:8px;padding:20px;margin-bottom:16px}h2{margin:0 0 16px;font-size:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.metric{background:#f4f5f7;padding:16px;border-radius:5px}.metric strong{display:block;font-size:28px}label{display:grid;gap:5px;margin-bottom:10px}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left}td,th{padding:10px;border-bottom:1px solid #e3e7eb;white-space:nowrap}th{background:#f4f5f7}.bad{color:#a32727}.good{color:#176746}.muted{color:#65717e}.warn{color:#875b00}footer{font-size:13px;color:#65717e}dialog{border:1px solid #ccd2d9;border-radius:8px;max-width:500px;width:90%}dialog::backdrop{background:#0005}
</style><header><h1>Inspections</h1><p>Administrative personnel and training records · Fictional demonstration</p></header><main><nav id="nav"></nav><div id="view"></div><footer>Demo only. Browser storage is not an approved records system. Do not enter actual DoD IDs, sensitive records, or operational inventory. No issuance or authorization functionality.</footer></main><dialog id="editor"><form id="editForm"><h2 id="editTitle"></h2><div id="fields"></div><button class="primary" type="submit">Save</button> <button type="button" id="cancel">Cancel</button></form></dialog>
<script>
"use strict";
const key="inspections-admin-demo-v1", topics=["M18","M4A1","M4","M110A1","Baton","Radio","O.C. Spray","Taser"];
const seed=()=>({people:[{id:"DEMO-001",last:"Demo",first:"Alex",grade:"SSgt",unit:"Example Unit",dates:{"M18":"2027-12-31","M4A1":"2025-10-31","Baton":"2027-06-30"}},{id:"DEMO-002",last:"Sample",first:"Jordan",grade:"SrA",unit:"Example Unit",dates:{"M4":"2027-12-31","Taser":"2027-08-31"}}],na:["Radio"],warning:30});
let state;try{state=JSON.parse(localStorage.getItem(key))||seed()}catch{state=seed()}let page="Dashboard",selected=state.people[0]?.id||"",editing=null;
const $=id=>document.getElementById(id), el=(tag,txt,cls)=>{const n=document.createElement(tag);if(txt!==undefined)n.textContent=txt;if(cls)n.className=cls;return n},save=()=>localStorage.setItem(key,JSON.stringify(state)),name=p=>p.last+", "+p.first, today=()=>new Date().toLocaleDateString("en-CA"),status=(p,t)=>{if(state.na.includes(t))return "N/A";const d=p.dates[t];if(!d)return "Unqualified";const now=new Date();now.setHours(0,0,0,0);const end=new Date(d+"T00:00:00");const days=Math.round((end-now)/86400000);return days<0?"Unqualified":days<=state.warning?"Expiring":"Current"};
function btn(label,fn,cls){const b=el("button",label,cls);b.type="button";b.onclick=fn;return b}
function section(title){const s=el("section");s.append(el("h2",title));$("view").append(s);return s}
function table(s,headers,rows){const wrap=el("div",undefined,"scroll"),t=el("table"),head=el("tr");headers.forEach(h=>head.append(el("th",h)));t.append(head);rows.forEach(row=>{const tr=el("tr");row.forEach(v=>{const td=el("td");if(v instanceof Node)td.append(v);else td.textContent=v;tr.append(td)});t.append(tr)});wrap.append(t);s.append(wrap)}
function choose(s){const label=el("label","Select individual"),sel=el("select");state.people.forEach(p=>{const o=el("option",name(p)+" ("+p.id+")");o.value=p.id;sel.append(o)});if(!state.people.some(p=>p.id===selected))selected=state.people[0]?.id||"";sel.value=selected;sel.onchange=()=>{selected=sel.value;render()};label.append(sel);s.append(label);return state.people.find(p=>p.id===selected)}
function mark(v){return el("span",v,v==="Unqualified"?"bad":v==="Current"?"good":v==="Expiring"?"warn":"muted")}
function field(parent,label,value,type="text"){const l=el("label",label),i=el("input");i.type=type;i.value=value||"";l.append(i);parent.append(l);return i}
function edit(p){editing=p;$("editTitle").textContent=p?"Edit fictional record":"Add fictional record";const f=$("fields");f.replaceChildren();const a=["id","last","first","grade","unit"].map(k=>field(f,({id:"Demo ID",last:"Last name",first:"First name",grade:"Grade",unit:"Organization"})[k],p?.[k]));a.slice(0,3).forEach(i=>i.required=true);if(p)a[0].readOnly=true;$("editForm").onsubmit=e=>{e.preventDefault();const values=a.map(i=>i.value.trim());if(!/^DEMO-[0-9]+$/.test(values[0]))return alert("Use a fictional ID such as DEMO-003.");if(!p&&state.people.some(x=>x.id===values[0]))return alert("Duplicate ID.");const record=Object.fromEntries(["id","last","first","grade","unit"].map((k,i)=>[k,values[i]]));record.dates=p?.dates||{};if(p)state.people[state.people.indexOf(p)]=record;else state.people.push(record);save();$("editor").close();render()};$("editor").showModal()}
function render(){const n=$("nav");n.replaceChildren();["Dashboard","Personnel","Qualifications","Review","Settings"].forEach(p=>n.append(btn(p,()=>{page=p;render()},p===page?"active":"")));$("view").replaceChildren();
if(page==="Dashboard"){const s=section("Overview"),g=el("div",undefined,"grid");const counts=state.people.flatMap(p=>topics.map(t=>status(p,t)));[["Personnel",state.people.length],["Current",counts.filter(x=>x==="Current").length],["Expiring",counts.filter(x=>x==="Expiring").length],["Unqualified",counts.filter(x=>x==="Unqualified").length]].forEach(([label,v])=>{const m=el("div",label,"metric");m.append(el("strong",v));g.append(m)});s.append(g);section("About this demo").append(el("p","Track fictional personnel and training expiration dates independently. Review missing and expired dates without altering the original records."))}
if(page==="Personnel"){const s=section("Personnel database");s.append(btn("Add person",()=>edit(null),"primary"));table(s,["Name","Demo ID","Grade","Organization","Actions"],state.people.map(p=>[name(p),p.id,p.grade,p.unit,btn("Edit",()=>edit(p))]))}
if(page==="Qualifications"){const s=section("Qualification records"),p=choose(s);if(!p)return;const form=el("form"),inputs={};topics.forEach(t=>inputs[t]=field(form,t,p.dates[t],"date"));const b=el("button","Save dates","primary");b.type="submit";form.append(b);form.onsubmit=e=>{e.preventDefault();topics.forEach(t=>p.dates[t]=inputs[t].value);save();render()};s.append(form)}
if(page==="Review"){const s=section("Individual review"),p=choose(s);if(!p)return;s.append(el("p",name(p)+" · "+p.grade+" · "+p.unit));table(s,["Training category","Recorded expiration","Status"],topics.map(t=>[t,p.dates[t]||"Not entered",mark(status(p,t))]))}
if(page==="Settings"){const s=section("Administrative preferences"),w=field(s,"Expiration warning days",String(state.warning),"number");w.min=0;w.max=365;w.onchange=()=>{state.warning=Math.max(0,Math.min(365,Number(w.value)||0));save();render()};s.append(el("h3","Not applicable training categories"));topics.forEach(t=>{const l=el("label"),c=el("input");c.type="checkbox";c.checked=state.na.includes(t);c.onchange=()=>{state.na=c.checked?[...new Set([...state.na,t])]:state.na.filter(x=>x!==t);save();render()};l.style.display="flex";l.append(c,document.createTextNode(t));s.append(l)});s.append(btn("Reset fictional demo",()=>{if(confirm("Replace all local demo changes?")){state=seed();save();render()}}))}
}
$("cancel").onclick=()=>$("editor").close();render();
</script></html>
